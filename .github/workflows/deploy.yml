name: Deploy to GitHub Pages

# 只在 main 分支推送时部署；也支持在 Actions 页面手动触发
on:
  push:
    branches: [main]
  workflow_dispatch:

# 部署 Pages 所需的最小权限。
# 注意这里用的是 GitHub 自动注入的 GITHUB_TOKEN，
# 不需要、也不应该使用任何个人访问令牌（PAT）。
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署；新推送排队而不取消正在进行的发布
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 关卡与算法校验（300 项）
        run: npm run validate

      - name: 构建静态站点
        run: npm run build

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
